# PizzaPos cloud stack — runs on Hetzner (Ubuntu 24.04).
#
# Brings up three services:
#   - postgres : data of record (PostgreSQL 16, persisted to a named volume)
#   - api      : .NET 10 PizzaPos.Api (built from ../backend/PizzaPos.Api)
#   - caddy    : reverse proxy + auto-HTTPS via Let's Encrypt
#
# Operator workflow:
#   1) cp .env.example .env  &&  fill in real secrets
#   2) docker compose up -d --build
#   3) docker compose exec api dotnet ef database update
#      (or rely on EnsureCreated for the very first run if no migrations exist)

services:
  postgres:
    image: postgres:16-alpine
    container_name: pizzapos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Lock the locale down so ILIKE / collation behavior is predictable
      # across host migrations (Turkish locale would break case folding).
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
    volumes:
      - pizzapos-pgdata:/var/lib/postgresql/data
    # Internal-only: API talks to it over the docker network. Don't expose
    # 5432 publicly — backups should run via `docker compose exec`.
    expose:
      - "5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../backend/PizzaPos.Api
      dockerfile: Dockerfile
    image: pizzapos-api:latest
    container_name: pizzapos-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://0.0.0.0:5000
      Database__Provider: Postgres
      ConnectionStrings__Default: >-
        Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD};Pooling=true;Maximum Pool Size=20

      Auth__Jwt__Secret: ${JWT_SECRET}
      Auth__Jwt__Issuer: PizzaPos
      Auth__Jwt__Audience: PizzaPos.Web
      Auth__Jwt__ExpiryHours: "12"

      Cors__AllowedOrigins: ${CORS_ALLOWED_ORIGINS}

      Sync__Enabled: "true"
      Sync__HmacSecret: ${HMAC_SECRET}
      # Cloud instance has no upstream — both workers stay quiet without a URL.
      Sync__CloudBaseUrl: ""

      Supervisor__BootstrapUsername: ${SUPERVISOR_BOOTSTRAP_USERNAME}
      Supervisor__BootstrapPassword: ${SUPERVISOR_BOOTSTRAP_PASSWORD}
      Supervisor__BootstrapFullName: "Platform Supervisor"
    expose:
      - "5000"

  caddy:
    image: caddy:2-alpine
    container_name: pizzapos-caddy
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - pizzapos-caddy-data:/data        # Let's Encrypt certs (persisted)
      - pizzapos-caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}

volumes:
  pizzapos-pgdata:
  pizzapos-caddy-data:
  pizzapos-caddy-config:
