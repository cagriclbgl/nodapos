appId: com.pizzapos.desktop
productName: PizzaPos
directories:
  output: dist-installer
publish:
  provider: github
  owner: cagriclbgl
  repo: nodapos
  releaseType: release
files:
  - dist/**
  - package.json
extraResources:
  - from: resources/api
    to: api
  - from: resources/frontend
    to: frontend
  - from: resources/cidshow
    to: cidshow
win:
  target: nsis
  artifactName: ${productName}-Setup-${version}.${ext}
  icon: build/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: PizzaPos
  createDesktopShortcut: true
  createStartMenuShortcut: true
asar: true
# Native modüller (node-hid, usb) asar içinden çalışmaz — runtime'da
# `.node` dosyalarına dosya yolu üzerinden erişilir, bu da asar'ın
# desteklemediği bir mekanizma. Bu klasörler asar dışında bırakılır.
asarUnpack:
  - node_modules/node-hid/**
  - node_modules/usb/**
  - node_modules/@serialport/**
  # koffi prebuilt native binary (FFI loader) — Windows 10 x64 prebuild,
  # derleme yok. asar içinden dlopen edilemez, dışarı alınmalı.
  - node_modules/koffi/**
# node-hid ve usb NAPI prebuilt binary'leri zaten elimizde (HID-win32-x64
# ve win32-x64 klasörleri). electron-builder'ın varsayılan olarak çalıştırdığı
# electron-rebuild, bu makinede VS 2026 + node-gyp uyumsuzluğu nedeniyle
# fail oluyor. NAPI ABI stable olduğundan rebuild'e gerek yok.
npmRebuild: false
