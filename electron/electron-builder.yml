appId: com.pizzapos.desktop
productName: PizzaPos
directories:
  output: dist-installer
files:
  - dist/**
  - package.json
extraResources:
  - from: resources/api
    to: api
  - from: resources/frontend
    to: frontend
win:
  target: nsis
  artifactName: ${productName}-Setup-${version}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  shortcutName: PizzaPos
  createDesktopShortcut: true
  createStartMenuShortcut: true
asar: true
# Native modüller (node-hid, usb) asar içinden çalışmaz — runtime'da
# `.node` dosyalarına dosya yolu üzerinden erişilir, bu da asar'ın
# desteklemediği bir mekanizma. Bu klasörler asar dışında bırakılır.
asarUnpack:
  - node_modules/node-hid/**
  - node_modules/usb/**
  - node_modules/@serialport/**
